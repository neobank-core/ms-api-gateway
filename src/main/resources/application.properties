spring.application.name=ms-api-gateway
server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/neobank

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/api-docs/user-service

springdoc.swagger-ui.urls[1].name=account-service
springdoc.swagger-ui.urls[1].url=/api-docs/account-service

springdoc.swagger-ui.urls[2].name=card-service
springdoc.swagger-ui.urls[2].url=/api-docs/card-service

springdoc.swagger-ui.urls[3].name=transaction-service
springdoc.swagger-ui.urls[3].url=/api-docs/transaction-service

springdoc.swagger-ui.urls[4].name=admin-service
springdoc.swagger-ui.urls[4].url=/api-docs/admin-service

springdoc.swagger-ui.urls[5].name=notification-service
springdoc.swagger-ui.urls[5].url=/api-docs/notification-service

spring.cloud.gateway.server.webmvc.routes[0].id=user-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

