spring.application.name=ms-api-gateway
server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/neobank

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.cloud.gateway.mvc.routes[0].id=user-auth
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=user-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[2].id=account-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.mvc.routes[3].id=card-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/cards/**

spring.cloud.gateway.mvc.routes[4].id=transaction-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.mvc.routes[5].id=admin-service
spring.cloud.gateway.mvc.routes[5].uri=http://localhost:8086
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/admin/**